<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tommythai – Kokk, catering og import</title>
<meta name="description" content="Tommy Aarvik Helstrøm – kokk med 30 års erfaring. Catering, import og kjøkkenledelse – oppdrag worldwide.">
<link rel="icon" href="logo_mark.svg">
<style>
html,body{margin:0;height:100%;background:#0a1628;font-family:Georgia,"Times New Roman",serif;color:#c9d3e3}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:url(logo_mark.svg) center / min(120vh,120vw) no-repeat;opacity:.07;pointer-events:none}
a.inn{position:relative;display:block;text-decoration:none;text-align:center;padding:2rem 1.2rem}
a.inn img{width:min(620px,90vw);height:auto;border-radius:32px;box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 0 1px rgba(230,200,90,.25);transition:transform .35s ease,box-shadow .35s ease}
a.inn:hover img,a.inn:focus img{transform:translateY(-6px) scale(1.015);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 2px #c9a227}
a.inn span{display:block;margin-top:1.6rem;font-family:Arial,Helvetica,sans-serif;font-size:.8rem;letter-spacing:.32em;text-transform:uppercase;color:#e6c85a;opacity:.85;transition:opacity .3s}
a.inn:hover span{opacity:1}
a.inn span::after{content:"→";display:inline-block;margin-left:.6rem;transition:transform .3s}
a.inn:hover span::after{transform:translateX(6px)}
.fot{position:fixed;bottom:1rem;left:0;right:0;text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:.7rem;letter-spacing:.1em;color:#5b6a80}
.fot a{color:#5b6a80;text-decoration:none}
@media(prefers-reduced-motion:reduce){a.inn img,a.inn span,a.inn span::after{transition:none}}
</style>
</head>
<body>
<a class="inn" href="hjem.html" aria-label="Gå til hjemmesiden">
<img src="logo.jpg" alt="Tommy Aarvik Helstrøm – Catering &amp; Import">
<span>Gå inn</span>
</a>
<div class="fot">© 2026 Tommythai · <a href="admin.html">Admin logg inn</a></div>
</body>
</html>
