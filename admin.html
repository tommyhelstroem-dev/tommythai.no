function parseTime(s){const[h,m]=String(s||"0:0").split(":").map(Number);return h*60+m;}
function minToH(m){return+(m/60).toFixed(2);}
function calcH(e,s){
const st=parseTime(e.start),en=parseTime(e.end),tot=en-st;
if(tot<=0)return{normal:0,evening:0,weekend:0,total:0};
const dow=new Date(e.date).getDay(),isSun=dow===0,isSat=dow===6;
const ev=(s.eveningStart||21)*60,weStart=(s.weekendStart??12)*60;
if(isSun)return{normal:0,evening:0,weekend:minToH(tot),total:minToH(tot)};
if(isSat){
let nm=0,em=0,wm=0;
if(en<=weStart){if(en<=ev)nm=tot;else if(st>=ev)em=tot;else{nm=ev-st;em=en-ev;}}
else if(st>=weStart){wm=tot;}
else{wm=en-weStart;const b=weStart;if(b<=ev)nm=weStart-st;else if(st>=ev)em=weStart-st;else{nm=ev-st;em=b-ev;}}
return{normal:minToH(nm),evening:minToH(em),weekend:minToH(wm),total:minToH(tot)};
}
let nm=0,em=0;
if(en<=ev)nm=tot;else if(st>=ev)em=tot;else{nm=ev-st;em=en-ev;}
return{normal:minToH(nm),evening:minToH(em),weekend:0,total:minToH(tot)};
}
function calcAmt(e,s){
const h=calcH(e,s),r=s.normalRate||0;

function downloadInvoiceFile(inv,settings){
const html=buildInvoiceHTML(inv,settings);
try{
const blob=new Blob([html],{type:"text/html;charset=utf-8"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;a.download=`Faktura-${inv.number}.html`;a.rel="noopener";a.style.display="none";
document.body.appendChild(a);a.click();
setTimeout(()=>{try{document.body.removeChild(a);URL.revokeObjectURL(url);}catch{}},2000);
return{ok:true,html};
}catch(e1){
try{
const a=document.createElement("a");
a.href="data:text/html;charset=utf-8,"+encodeURIComponent(html);
a.download=`Faktura-${inv.number}.html`;a.style.display="none";
document.body.appendChild(a);a.click();
setTimeout(()=>{try{document.body.removeChild(a);}catch{}},2000);
return{ok:true,html};
}catch(e2){return{ok:false,html};}
}
}
function openInvoicePrint(inv,settings){
const w=window.open("","_blank");
if(!w){return downloadInvoiceFile(inv,settings);}
w.document.open();w.document.write(buildInvoiceHTML(inv,settings));w.document.close();
return{ok:true};
}

const [saving,setSaving]=useState(false),[saved,setSaved]=useState(false);

const recalc=u=>{
const t=(u.timeEntries||[]).reduce((s,e)=>s+(+e.amount||0),0);
const x=(u.expenseLines||[]).reduce((s,e)=>s+(+e.amount||0),0);
const y=(u.extraLines||[]).reduce((s,l)=>s+(+l.qty*+l.price),0);
const sub=+(t+x+y).toFixed(2),vat=+(sub*((settings.vatRate||0)/100)).toFixed(2);
return{...u,subtotal:sub,vat,totalIncVat:+(sub+vat).toFixed(2)};
};
const updT=(idx,k,v)=>setInv(p=>recalc({...p,timeEntries:p.timeEntries.map((e,i)=>{
if(i!==idx)return e;
if(k==="desc")return{...e,desc:v};
if(k==="amount")return{...e,amount:+v};
if(k==="date")return{...e,date:v,hours:calcH({...e,date:v},settings),amount:calcAmt({...e,date:v},settings)};
if(k==="start"||k==="end"){const ne={...e,[k]:v};return{...ne,hours:calcH(ne,settings),amount:calcAmt(ne,settings)};}
if(k==="hours"){
const nh=+v||0,old=e.hours||{},oldTot=old.total||0,f=oldTot>0?nh/oldTot:0;

const r=settings.normalRate||0;
const amt=+(nH.normal*r+nH.evening*r*(1+(settings.eveningRate||0)/100)+nH.weekend*r*(1+(settings.weekendRate||0)/100)).toFixed(2);
return{...e,hours:nH,amount:oldTot>0?amt:e.amount};
}
return e;

function InvoiceBuilder({invoices,timeEntries,customers,expenses,settings,saveInvoices,saveSettings,setPage,setPrintInvoice}){

const [selT,setSelT]=useState([]),[selExp,setSelExp]=useState([]),[extraLines,setExtras]=useState([]);
const [dueDate,setDueDate]=useState(()=>{const d=new Date();d.setDate(d.getDate()+14);return d.toISOString().split("T")[0];});
const [status,setStatus]=useState("ubetalt"),[notes,setNotes]=useState(""),[showDD,setShowDD]=useState(false);
const [fpManual,setFpManual]=useState(""),[flash,setFlash]=useState(""),[draft,setDraft]=useState(null);
const togT=id=>setSelT(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);

const addExtra=()=>setExtras(l=>[...l,{id:uid(),desc:"",qty:1,unit:"stk",price:0}]);
const updE=(id,k,v)=>setExtras(l=>l.map(x=>x.id===id?{...x,[k]:v}:x));
const delE=id=>setExtras(l=>l.filter(x=>x.id!==id));
const tTot=selT.reduce((s,id)=>{const e=timeEntries.find(t=>t.id===id);return s+(e?calcAmt(e,settings):0);},0);
const expTot=selExp.reduce((s,id)=>{const e=(expenses||[]).find(x=>x.id===id);return s+(e?e.amount:0);},0);
const eTot=extraLines.reduce((s,l)=>s+(l.qty*l.price),0);
const sub=+(tTot+expTot+eTot).toFixed(2),vat=+(sub*(settings.vatRate/100)).toFixed(2),total=+(sub+vat).toFixed(2);
const fpBase=+(tTot+extraLines.filter(l=>!l.isFeriepenger).reduce((s,l)=>s+(l.qty*l.price),0)).toFixed(2);
const fpCalc=+(fpBase*0.122).toFixed(2);
const addFPauto=()=>{
if(fpBase<=0){alert("Legg inn timer med sats eller en tilleggspost med beløp først.");return;}
setExtras(l=>[...l.filter(x=>!x.isFeriepenger),{id:uid(),desc:`Feriepenger (12,2%) av opptjente midler kr ${fmtM(fpBase)}`,qty:1,unit:"stk",price:fpCalc,isFeriepenger:true}]);

const expSnaps=selExp.map(id=>(expenses||[]).find(x=>x.id===id)).filter(Boolean);
return{id:uid(),number:num,date:new Date().toISOString().split("T")[0],dueDate,status:st,notes,
customerName:cName,customerAddr:cAddr,customerOrg:cOrg,timeEntries:teSnaps,expenseLines:expSnaps,
extraLines,subtotal:sub,vat,totalIncVat:total};
};

function InvoiceList({invoices,saveInvoices,settings,setPrintInvoice,setPage}){

<button onClick={()=>setConfirmDel(inv.id)} style={{...Btn("red"),fontSize:11,padding:"4px 8px"}}>Slett</button>
</div></td>
</tr>))}
</tbody>
</table>
</div></div>)}
</div>

function SettingsPage({settings,saveSettings,customers,saveCustomers,timeEntries,saveTimeEntries,expenses,saveExpenses,invoices,saveInvoices}){
const [s,setS]=useState(settings),[saved,setSaved]=useState(false),[err,setErr]=useState("");

const clean={...s};
["normalRate","eveningStart","eveningRate","weekendStart","weekendRate","vatRate","nextNum"].forEach(k=>{clean[k]=+String(clean[k]??0).replace(",",".")||0;});
setS(clean);await saveSettings(clean);setSaved(true);setErr("");setTimeout(()=>setSaved(false),2500);
}catch(e){setErr("Feil: "+e.message);}};
const loadSeed=async()=>{
const ns={...settings,...SEED.settings,nextNum:1001};
setS(ns);await saveSettings(ns);
await saveCustomers([...customers.filter(c=>c.orgNr!==SEED.customer.orgNr),{...SEED.customer,id:uid()}]);
const nt=SEED.time.map(t=>({...t,id:uid()})),ne=SEED.expenses.map(e=>({...e,id:uid()}));
await saveTimeEntries([...timeEntries,...nt]);await saveExpenses([...expenses,...ne]);
const te=nt.map(e=>({...e,hours:calcH(e,ns),amount:calcAmt(e,ns)}));
const sub=+(te.reduce((a,e)=>a+e.amount,0)+ne.reduce((a,e)=>a+e.amount,0)).toFixed(2);
const vat=+(sub*((ns.vatRate||0)/100)).toFixed(2);
await saveInvoices([...invoices,{id:uid(),number:"TAH-1000",date:"2026-08-02",dueDate:"2026-08-16",
status:"ubetalt",notes:"",customerName:SEED.customer.name,customerAddr:SEED.customer.address,
customerOrg:SEED.customer.orgNr,timeEntries:te,expenseLines:ne,extraLines:[],subtotal:sub,vat,totalIncVat:+(sub+vat).toFixed(2)}]);
setSeedMsg(`✓ Faktura TAH-1000 opprettet — kr ${fmtM(sub+vat)}. Se under «Fakturaer».`);
setTimeout(()=>setSeedMsg(""),9000);
};
const exportAll=()=>{

const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`tommythai-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();

<button onClick={addCust} style={{...Btn("pri"),whiteSpace:"nowrap"}}>+ Legg til</button>
</div>
{customers.map(c=>(<div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 10px",borderRadius:5,marginBottom:4,background:"#071525"}}>
<div><span style={{color:C.text,fontSize:13,fontWeight:600}}>{c.name}</span><span style={{color:C.textD,fontSize:11,marginLeft:10}}>{c.orgNr}</span><span style={{color:C.textD,fontSize:11,marginLeft:10}}>{c.address}</span></div>
<button onClick={()=>setConfirmDelC(c.id)} style={{...Btn("red"),padding:"3px 8px",fontSize:11}}>Slett</button>
</div>))}
{customers.length===0&&<div style={{color:C.textD,textAlign:"center",padding:"12px 0",fontSize:13}}>Ingen kunder registrert ennå</div>}
</div>
</div>
);
}
function App({onHub}){
const [page,setPage]=useState("dashboard");
const [invoices,setInvoices]=useState([]);
const [timeEntries,setTimeEntries]=useState([]);
const [customers,setCustomers]=useState([]);
const [expenses,setExpenses]=useState([]);
const [settings,setSettings]=useState(DEFSETT);
const [printInvoice,setPrintInvoice]=useState(null);
const [loaded,setLoaded]=useState(false);
useEffect(()=>{
Promise.all([db.get("inv:inv"),db.get("inv:time"),db.get("inv:cust"),db.get("inv:sett"),db.get("inv:exp")])
.then(([inv,time,cust,sett,exp])=>{
if(inv)setInvoices(inv);if(time)setTimeEntries(time);if(cust)setCustomers(cust);
if(sett)setSettings(s=>({...s,...sett}));if(exp)setExpenses(exp);
setLoaded(true);
});
},[]);
const saveInvoices=async d=>{setInvoices(d);await db.set("inv:inv",d);};
const saveTimeEntries=async d=>{setTimeEntries(d);await db.set("inv:time",d);};
const saveCustomers=async d=>{setCustomers(d);await db.set("inv:cust",d);};
const saveSettings=async d=>{setSettings(d);await db.set("inv:sett",d);};
const saveExpenses=async d=>{setExpenses(d);await db.set("inv:exp",d);};
if(!loaded)return(<div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.bg}}><div style={{textAlign:"center"}}><LogoSVG w={90} h={90} noText={true}/><div style={{color:C.blueL,fontSize:11,marginTop:14,letterSpacing:".2em"}}>LASTER...</div></div></div>);
const ctx={invoices,timeEntries,customers,expenses,settings,saveInvoices,saveTimeEntries,saveCustomers,saveExpenses,saveSettings,setPage,setPrintInvoice};
return(
<div style={{display:"flex",height:"100vh",background:C.bg,color:C.text,fontFamily:"system-ui,-apple-system,sans-serif",overflow:"hidden"}}>
<Sidebar page={page} setPage={setPage} onHub={onHub}/>
<div style={{flex:1,overflowY:"auto"}}>
{page==="dashboard"&&<Dashboard {...ctx}/>}
{page==="time"&&<TimeTracking {...ctx}/>}
{page==="expenses"&&<ExpensesPage {...ctx}/>}
{page==="new-invoice"&&<InvoiceBuilder {...ctx}/>}
{page==="invoices"&&<InvoiceList {...ctx}/>}
{page==="settings"&&<SettingsPage {...ctx}/>}
</div>
{printInvoice&&<EditablePreview invoice={printInvoice} settings={settings} invoices={invoices} saveInvoices={saveInvoices} onClose={()=>setPrintInvoice(null)}/>}
</div>
);
}
// ── Admin-portal: alle programmer ────────────────────────────────────────
const PROGRAMS=[
{id:"faktura",name:"Fakturaprogram",desc:"Timer, utgifter, fakturaer og kunderegister.",ready:true},
{id:"hjernedump",name:"Hjernedump",desc:"Notater, mapper, kalender og diktafon.",ready:false},
{id:"oppskrifter",name:"Oppskrifter",desc:"Oppskriftsbank med bilder og porsjonsskalering.",ready:false},
];
function Hub({open}){
return(
<div style={{minHeight:"100vh",background:C.bg,padding:"40px 20px"}}>
<div style={{maxWidth:900,margin:"0 auto"}}>
<div style={{textAlign:"center",marginBottom:30}}>
<LogoSVG w={110} h={110} noText={true}/>
<div style={{color:C.white,fontFamily:"Georgia,serif",letterSpacing:".18em",fontSize:15,marginTop:10}}>ADMIN</div>
<div style={{color:C.textD,fontSize:12,marginTop:4}}>Tommy Aarvik Helstrøm Catering &amp; Import AS</div>
</div>
<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:14}}>
{PROGRAMS.map(p=>(
<div key={p.id} onClick={()=>p.ready&&open(p.id)} style={{...crd,marginBottom:0,cursor:p.ready?"pointer":"default",opacity:p.ready?1:.5,borderTop:`3px solid ${p.ready?C.gold:C.bdr}`}}>
<div style={{color:C.white,fontSize:15,fontWeight:700,marginBottom:6}}>{p.name}</div>
<div style={{color:C.textD,fontSize:12,minHeight:36}}>{p.desc}</div>
<div style={{marginTop:12,fontSize:11,color:p.ready?C.gold:C.textD,fontWeight:600,letterSpacing:".08em"}}>{p.ready?"ÅPNE →":"KOMMER"}</div>
</div>))}
</div>
</div>
</div>
);
}
function Portal(){
const [prog,setProg]=useState(()=>location.hash.replace("#","")||"");
const open=id=>{location.hash=id;setProg(id);};
const hub=()=>{location.hash="";setProg("");};
if(prog==="faktura")return <App onHub={hub}/>;
return <Hub open={open}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Gate/>);
</script>
</body>
